name: Deploy branch preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: branch-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Validate Worker bundle
        run: npm run deploy:dry-run

      - name: Derive isolated Worker name
        id: preview
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed -E 's/^-+//; s/-+$//' | cut -c1-28)
          if [[ -z "$slug" ]]; then
            slug=branch
          fi
          hash=$(printf '%s' "$REF_NAME" | shasum -a 256 | cut -c1-8)
          worker_name="astro-cf-preview-${slug}-${hash}"
          echo "worker_name=$worker_name" >> "$GITHUB_OUTPUT"
          echo "Deploying isolated preview Worker: $worker_name"

      - name: Deploy isolated preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ steps.preview.outputs.worker_name }}

      - name: Publish preview summary
        env:
          WORKER_NAME: ${{ steps.preview.outputs.worker_name }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          {
            echo "## Cloudflare branch preview"
            echo
            echo "- Worker: \`$WORKER_NAME\`"
            if [[ -n "$DEPLOYMENT_URL" ]]; then
              echo "- URL: $DEPLOYMENT_URL"
            else
              echo "- URL: see the Wrangler deploy step output"
            fi
            echo "- Production Worker \`astro-cf\` was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
